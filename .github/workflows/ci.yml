name: ci

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # TanStack file-route types are generated by the web build. Generate them
      # before the repository-wide typecheck so CI never validates a stale tree.
      - run: bun run build:web
      - run: bun run typecheck
      - run: bun run test:all
      - run: bun run test:db
      - run: bun run test:security
      - run: bunx playwright install --with-deps chromium
      - id: browser_smoke
        run: bun run test:e2e:browser
      - run: bun run build
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
