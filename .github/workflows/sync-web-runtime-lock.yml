name: sync-web-runtime-lock

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-web-runtime-lock.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Regenerate lockfile deterministically
        run: bun install
      - name: Ensure only lockfile changed before cleanup
        shell: bash
        run: |
          CHANGED="$(git diff --name-only)"
          if [ -n "$CHANGED" ] && [ "$CHANGED" != "bun.lock" ]; then
            echo "Unexpected tracked files changed:"
            echo "$CHANGED"
            exit 1
          fi
      - name: Commit lockfile and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git rm .github/workflows/sync-web-runtime-lock.yml
          git commit -m "fix: package postgres in production runtime"
          git push origin HEAD:main
