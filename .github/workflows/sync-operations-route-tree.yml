# rerun-after-storefront-theme-fix
name: sync-operations-route-tree
on:
  push:
    branches: [feat/merchant-operations-gpt]
    paths: [.github/workflows/sync-operations-route-tree.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/merchant-operations-gpt
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: cd apps/web && bun run build
      - name: Ensure only generated route tree changed
        shell: bash
        run: |
          CHANGED="$(git diff --name-only)"
          if [ -n "$CHANGED" ] && [ "$CHANGED" != "apps/web/src/routeTree.gen.ts" ]; then
            echo "$CHANGED"
            exit 1
          fi
      - name: Commit generated route tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/routeTree.gen.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: sync operations route tree"
          git push origin HEAD:feat/merchant-operations-gpt
