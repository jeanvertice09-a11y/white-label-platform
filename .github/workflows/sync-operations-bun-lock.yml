name: sync-operations-bun-lock
on:
  push:
    branches: [feat/merchant-operations-gpt]
    paths: [.github/workflows/sync-operations-bun-lock.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/merchant-operations-gpt
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install
      - name: Ensure only lockfile changed
        shell: bash
        run: |
          CHANGED="$(git diff --name-only)"
          if [ -n "$CHANGED" ] && [ "$CHANGED" != "bun.lock" ]; then
            echo "$CHANGED"
            exit 1
          fi
      - name: Commit synchronized lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: sync operations bun lockfile"
          git push origin HEAD:feat/merchant-operations-gpt
